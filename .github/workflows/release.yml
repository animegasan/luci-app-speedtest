name: Build OpenWrt APK

on:
  push:
    branches:
      - speedtestcpp
    paths:
      - 'Makefile'
      - 'htdocs/**'
      - 'po/**'
      - 'root/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

env:
  OPENWRT_VERSION: 25.12.6
  SDK_URL: https://downloads.openwrt.org/releases/25.12.6/targets/x86/64/openwrt-sdk-25.12.6-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst

jobs:
  build:
    name: Build OpenWrt 25.12 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential clang flex bison g++ gawk gettext git \
            libncurses-dev libssl-dev python3 python3-setuptools \
            rsync swig unzip zlib1g-dev file wget zstd

      - name: Prepare SDK and package source
        shell: bash
        run: |
          set -euo pipefail

          PKG_NAME="${GITHUB_REPOSITORY##*/}"
          PKG_VERSION="$(sed -n 's/^PKG_VERSION:=//p' Makefile | head -n 1)"
          test -n "$PKG_VERSION" || { echo "PKG_VERSION not found in Makefile" >&2; exit 1; }

          echo "PKG_NAME=$PKG_NAME" >> "$GITHUB_ENV"
          echo "PKG_VERSION=$PKG_VERSION" >> "$GITHUB_ENV"

          curl --fail --location --retry 3 "$SDK_URL" --output sdk.tar.zst
          mkdir -p sdk
          tar --zstd -xf sdk.tar.zst -C sdk --strip-components=1

          mkdir -p "sdk/package/$PKG_NAME"
          git archive HEAD | tar -xf - -C "sdk/package/$PKG_NAME"
          chmod +x "sdk/package/$PKG_NAME/root/usr/share/speedtest/schedule"

      - name: Update SDK feeds
        shell: bash
        run: |
          set -euo pipefail
          cd sdk
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure and compile package
        shell: bash
        run: |
          set -euo pipefail
          cd sdk
          make defconfig
          rm -rf feeds/luci/contrib/package/csstidy
          sed -i '/^CONFIG_LUCI_JSMIN=/d' .config
          sed -i '/^CONFIG_LUCI_CSSTIDY=/d' .config

          make "package/${PKG_NAME}/clean"
          make "package/${PKG_NAME}/compile" -j"$(nproc)" V=s

          PKG_PATH="$(find bin/packages -type f -name "${PKG_NAME}_*.apk" -print -quit)"
          if [[ -z "$PKG_PATH" || ! -f "$PKG_PATH" ]]; then
            echo "No ${PKG_NAME} APK was produced under sdk/bin/packages" >&2
            exit 1
          fi

          echo "PKG_PATH=sdk/$PKG_PATH" >> "$GITHUB_ENV"
          echo "Built package: $PKG_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-speedtest-openwrt-${{ env.OPENWRT_VERSION }}-x86-64
          path: ${{ env.PKG_PATH }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release
        if: github.ref == 'refs/heads/speedtestcpp'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: ${{ env.PKG_NAME }} ${{ env.PKG_VERSION }} (OpenWrt ${{ env.OPENWRT_VERSION }})
          tag_name: ${{ env.PKG_VERSION }}
          draft: false
          prerelease: false
          files: ${{ env.PKG_PATH }}
          body: |
            OpenWrt ${{ env.OPENWRT_VERSION }} x86/64 APK build of `${{ env.PKG_NAME }}`.

            Runtime dependency:
            - `speedtestcpp`
